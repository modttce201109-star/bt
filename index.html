<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Photo Gallery - Final Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }
        #image {
            width: 600px;
            height: 400px;
            border: 5px solid #333;
            margin: 20px auto;
            background-color: #999;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            color: white;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .preview {
            width: 100px;
            height: 70px;
            object-fit: cover;
            margin: 5px;
            border: 3px solid transparent;
            cursor: pointer;
        }
        .preview:focus, .preview:hover {
            border-color: #007bff;
        }
    </style>
</head>
<body onload="addTabIndexes()">

    <h1>Accessible Photo Gallery</h1>

    <!-- Khung hiển thị chính -->
    <div id="image">
        Hover over or focus on an image below.
    </div>

    <!-- 6 bức ảnh có alt text và các sự kiện chuột/bàn phím -->
    <div>
        <img class="preview" src="https://picsum.photos/id/1015/600/400" alt="River through mountain valley" onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="https://picsum.photos/id/1016/600/400" alt="Valley during sunset" onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="https://picsum.photos/id/1018/600/400" alt="Forest and flowing river" onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="https://picsum.photos/id/1019/600/400" alt="Snowy mountain peaks" onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="https://picsum.photos/id/1020/600/400" alt="Bear in nature" onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <img class="preview" src="https://picsum.photos/id/1024/600/400" alt="Vulture perched on branch" onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
    </div>

    <!-- Liên kết file JavaScript -->
    <script src="gallery.js"></script>
</body>
</html>
